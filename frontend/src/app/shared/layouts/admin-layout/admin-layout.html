<div class="admin-layout-container">
  
  <!-- Menú Lateral (Sidebar) -->
  <aside class="sidebar glass-bento">
  <div class="brand">
  <img src="assets/images/sensoria_logo.svg" alt="Logo Sensoria" />
  <h1>Sensoria</h1>
</div>
    
    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <!-- Icono: Dashboard (Layout) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"></rect>
          <rect x="14" y="3" width="7" height="5" rx="1"></rect>
          <rect x="14" y="12" width="7" height="9" rx="1"></rect>
          <rect x="3" y="16" width="7" height="5" rx="1"></rect>
        </svg>
        <span>Panel de Control</span>
      </a>

      <a routerLink="/admin/clientes" routerLinkActive="active" class="nav-item">
        <!-- Icono: Users -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Clientes (PYMES)</span>
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <a routerLink="/" class="nav-item logout">
        <!-- Icono: Log out -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir al Home</span>
      </a>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="main-content">
    
    <!-- Barra Superior -->
    <header class="topbar glass-bento">
      <div class="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Buscar clientes o dispositivos...">
      </div>
      <div class="user-profile">
        <div class="avatar">AD</div>
        <span class="name">Administrador</span>
      </div>
    </header>

    <!-- Aquí se inyecta el Dashboard o la vista de Clientes -->
    <div class="view-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
